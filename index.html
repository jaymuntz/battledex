<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Battleground</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <h1>Battleground</h1>
    <p class="tagline">Two fighters enter. One verdict leaves.</p>
    <button type="button" class="btn btn-link" data-action="open-dex">BattleDex</button>
  </header>

  <main>
    <!-- View 1: input form (only view visible on load) -->
    <section id="view-form" class="view">
      <form id="fight-form" novalidate>
        <div class="field">
          <label for="fighter-a">Fighter A</label>
          <input id="fighter-a" name="fighterA" type="text" maxlength="60"
                 placeholder="e.g. a grizzly bear" autocomplete="off">
        </div>

        <div class="vs" aria-hidden="true">VS</div>

        <div class="field">
          <label for="fighter-b">Fighter B</label>
          <input id="fighter-b" name="fighterB" type="text" maxlength="60"
                 placeholder="e.g. 10 angry geese" autocomplete="off">
        </div>

        <p id="form-message" class="form-message" role="alert"></p>

        <button type="submit" class="btn btn-primary">Fight!</button>
      </form>
    </section>

    <!-- View 2: loading -->
    <section id="view-loading" class="view" hidden>
      <div class="spinner" aria-hidden="true"></div>
      <p class="loading-text" aria-live="polite">Judging the fight…</p>
    </section>

    <!-- View 3: result -->
    <section id="view-result" class="view" hidden>
      <div class="matchup">
        <figure class="fighter" id="fighter-card-a">
          <img id="image-a" alt="">
          <figcaption id="name-a"></figcaption>
          <button type="button" class="btn btn-secondary btn-small" data-action="save" data-side="A">Save to BattleDex</button>
        </figure>
        <div class="vs" aria-hidden="true">VS</div>
        <figure class="fighter" id="fighter-card-b">
          <img id="image-b" alt="">
          <figcaption id="name-b"></figcaption>
          <button type="button" class="btn btn-secondary btn-small" data-action="save" data-side="B">Save to BattleDex</button>
        </figure>
      </div>

      <div class="verdict">
        <p class="verdict-label">Winner</p>
        <h2 id="winner-name"></h2>
        <p id="reasoning"></p>
      </div>

      <p id="save-message" class="save-message" role="status"></p>

      <div class="actions">
        <button type="button" class="btn btn-primary" data-action="new-fight">New fight</button>
        <button type="button" class="btn btn-secondary" data-action="open-dex">View BattleDex</button>
      </div>
    </section>

    <!-- View 5: BattleDex (saved fighters, from localStorage) -->
    <section id="view-dex" class="view" hidden>
      <div class="dex-header">
        <h2>BattleDex</h2>
        <button type="button" class="btn btn-danger btn-small" data-action="clear-dex">Clear all</button>
      </div>

      <p id="dex-empty" class="dex-empty">No fighters saved yet. Win (or lose) a fight and save a fighter from the result.</p>
      <ul id="dex-grid" class="dex-grid"></ul>

      <div class="actions">
        <button type="button" class="btn btn-secondary" data-action="back-to-fight" id="back-to-fight">Back to last fight</button>
        <button type="button" class="btn btn-primary" data-action="new-fight">New fight</button>
      </div>
    </section>

    <!-- View 4: error -->
    <section id="view-error" class="view" hidden>
      <h2>Something went wrong</h2>
      <p id="error-message">The judges couldn't reach a verdict. Please try again.</p>
      <button type="button" class="btn btn-primary" data-action="new-fight">Try again</button>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
